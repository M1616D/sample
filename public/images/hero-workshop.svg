<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Placeholder illustration of an industrial workshop">
  <defs>
    <pattern id="hg" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2025" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0c0f" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#12151a"/>
  <rect width="1600" height="900" fill="url(#hg)"/>

  <!-- Structural gantry -->
  <g fill="none" stroke="#3a4049" stroke-width="4">
    <path d="M0 640h1600"/>
    <path d="M120 640V120h1360v520"/>
    <path d="M120 300h1360M120 470h1360"/>
  </g>

  <!-- Machining centres -->
  <g fill="none" stroke="#9aa2ac" stroke-width="3">
    <rect x="200" y="420" width="300" height="220" rx="2"/>
    <rect x="240" y="360" width="220" height="60"/>
    <path d="M260 520h180M310 520v120"/>
    <circle cx="350" cy="470" r="34"/>

    <rect x="620" y="380" width="340" height="260" rx="2"/>
    <path d="M620 470h340"/>
    <circle cx="700" cy="530" r="28"/><circle cx="880" cy="530" r="28"/>

    <rect x="1080" y="300" width="230" height="340" rx="2"/>
    <path d="M1130 300V190h130v110"/>
  </g>

  <!-- Accent: material flow / conveyor -->
  <g fill="none" stroke="#f97316" stroke-width="4">
    <path d="M140 700h1320"/>
    <path d="M170 700l-30 34h1260l30-34"/>
  </g>
  <g fill="#f97316" fill-opacity="0.85">
    <rect x="330" y="662" width="72" height="30"/>
    <rect x="760" y="662" width="72" height="30"/>
    <rect x="1180" y="662" width="72" height="30"/>
  </g>

  <rect width="1600" height="900" fill="url(#shade)"/>

  <g>
    <rect x="48" y="48" width="230" height="38" fill="#f97316"/>
    <text x="163" y="74" fill="#12151a" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2.5" text-anchor="middle">PLACEHOLDER IMAGE</text>
  </g>
  <text x="48" y="846" fill="#6d7580" font-family="Helvetica,Arial,sans-serif" font-size="18">
    Upload a photograph of your workshop, machines or finished products.
